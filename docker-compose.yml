version: '3.8'

services:
  # ------------------------------------------------------------------
  # 1. Vector Database: Qdrant
  # ------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: catalogiq-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # 2. FastAPI Backend Core
  # ------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogiq-backend
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}
      - OMNIROUTE_MODEL=${OMNIROUTE_MODEL:-auto/fast}
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ------------------------------------------------------------------
  # 3. Streamlit Interactive Dashboard
  # ------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogiq-frontend
    restart: unless-stopped
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000/ask
    depends_on:
      - backend

volumes:
  qdrant_storage: